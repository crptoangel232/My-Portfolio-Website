DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Attitudes Survey SL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial; padding: 15px; background: #f0f4f8; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px #ccc; margin-bottom: 15px; }
  h2 { color: #2c5f7a; }
  button { background: #2c5f7a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; }
  select, button { margin-top: 8px; }
  label { font-weight: bold; }
</style>
</head>
<body>

<h2>🩺 Health Attitudes Survey - Sierra Leone</h2>
<p><small>Anonymous. For research + awareness.</small></p>

<div class="card" id="surveyForm">
  <p
  <label>1. Age Group</label>
  <select id="age">
    <option>16-20</option>
    <option>21-25</option>
    <option>26-30</option>
    <option>31+</option>
  </select>
</p>
<p
  <label>2. Gender</label>
  <select id="gender">
    <option>Female</option>
    <option>Male</option>
    <option>Prefer not to say</option>
  </select>
</p>
<p
  <label>3. Would you talk to friends if you felt depressed?</label>
  <select id="q1">
    <option>Yes</option>
    <option>No</option>
    <option>Maybe</option>
  </select>
</p>
<p
  <label>4. Is mental health as important as physical health?</label>
  <select id="q2">
    <option>Yes</option>
    <option>No</option>
    <option>Not sure</option>
  </select>
</p>
  <button onclick="saveResponse()">Submit Response</button>
</div>

<div class="card">
  <h2>📊 Live Results</h2>
  <canvas id="myChart"></canvas>
  <p id="totalResponses"></p>
  <button onclick="clearData()" style="background:#c0392b; margin-top:10px;">Clear All Data</button>
</div>

<script>
let responses = JSON.parse(localStorage.getItem('surveyData')) || [];
function saveResponse(){
  let newData = {
    age: document.getElementById('age').value,
    gender: document.getElementById('gender').value,
    q1: document.getElementById('q1').value,
    q2: document.getElementById('q2').value,
    time: new Date().toLocaleString()
  };
  responses.push(newData);
  localStorage.setItem('surveyData', JSON.stringify(responses));
  alert("Thank you! Response saved.");
  updateChart();
}

// Chart
const ctx = document.getElementById('myChart');
let myChart;

function updateChart(){
  document.getElementById('totalResponses').innerText = "Total Responses: " + responses.length;
  
  let yes = responses.filter(r => r.q1 === "Yes").length;
  let no = responses.filter(r => r.q1 === "No").length;
  let maybe = responses.filter(r => r.q1 === "Maybe").length;

  if(myChart) myChart.destroy();
  
  myChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Yes', 'No', 'Maybe'],
      datasets: [{
        label: 'Would talk to friends if depressed',
        data: [yes, no, maybe],
        backgroundColor: ['#27ae60', '#e74c3c', '#f39c12']
      }]
    }
  });
}

function clearData(){
  if(confirm("u sure so?")){
    localStorage.removeItem('surveyData');
    responses = [];
    updateChart();
  }
}

// Load chart on start
updateChart();
</script>

</body>
</html>
